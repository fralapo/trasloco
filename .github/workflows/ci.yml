name: Quality checks
on:
  push:
    branches: [main, "hardening/**"]
  pull_request:

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.4']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: none
          coverage: none
      - name: Shell integration syntax
        run: bash -n tests/integration.sh
      - name: PHP syntax
        run: find . -type f -name '*.php' -not -path './storage/*' -print0 | xargs -0 -n 1 php -l
      - name: Translation consistency
        run: php tools/check-translations.php
      - name: Security and archive smoke tests
        run: php tests/security-smoke.php
      - name: Offline recovery payload and permission regressions
        run: php tests/offline-file-recovery-smoke.php
      - name: Offline SQL preview regressions
        run: php tests/sql-preview-smoke.php
      - name: Feature branch integrity manifest compatibility
        run: php tests/integrity-compat-smoke.php
      - name: WebDAV storage adapter safety
        run: php tests/webdav-storage-smoke.php
      - name: Offsite transfer integrity and collision checks
        run: php tests/offsite-transfer-smoke.php
      - name: Resumable peer transfer and collision checks
        run: php tests/peer-pull-smoke.php
